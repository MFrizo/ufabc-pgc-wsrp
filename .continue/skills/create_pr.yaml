name: create_pr
description: Creates a GitHub Pull Request with a pre-formatted description using the GitHub CLI (gh).
parameters:
  - name: title
    description: The title of the Pull Request.
  - name: branch
    description: The name of the head branch (the one containing your changes).
instructions: |
  1. Run `git status`, `git diff`, and `git log` (and `git diff <base-branch>...HEAD`) to review
     all staged/unstaged/untracked changes and the full commit history for this branch. If there
     are uncommitted changes, stop and ask the user whether to commit them first — never commit
     on their behalf without confirmation.
  2. Confirm you are on the correct branch (not `main`/`master`) and, if it needs to be pushed,
     confirm with the user before running `git push` — pushing is a visible, hard-to-reverse
     action.
  3. Search the repo for a PR template (`pull_request_template.md` or
     `.github/PULL_REQUEST_TEMPLATE/`) and fold in any required sections.
  4. Use the `gh pr create` command to create the PR. The body of the PR must follow this format:
     ## Description
     [Brief description of the PR]

     ## Why
     [Why the changes were made]

     ## How
     [How the changes were implemented]

     Generated with [Continue](https://continue.dev)
     Co-Authored-By: Continue <noreply@continue.dev>
  5. Ensure you provide the --title, --body, and --head arguments to `gh pr create`.
  6. Report the resulting PR URL back to the user.
